<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #FFFFFF;
    --fg: #1F2328;
    --muted: #6B7280;
    --line: #E0E0E0;
    --ok: #2E7D32;
    --off: #9AA0A6;
    --danger: #B3261E;
    --slate: #37474F;
    --warn: #B26A00;
    --radius: 5px;
    --pad: 14px;
    --gap: 8px;
  }

  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    padding: var(--pad);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--fg);
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }

  .status { display: flex; align-items: center; gap: var(--gap); }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--off); flex: 0 0 8px;
  }
  body.running .dot { background: var(--ok); }
  .state { font-weight: 600; }
  .addr {
    margin: 6px 0 0 16px;
    font-size: 12px; color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .error {
    margin-top: 10px;
    font-size: 12px; color: var(--danger);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }

  .actions { display: flex; gap: var(--gap); }
  button {
    flex: 1 1 0;
    height: 28px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #FAFAFA;
    color: var(--fg);
    font: inherit;
    cursor: default;
  }
  button:hover:not(:disabled) { background: #F0F0F0; }
  button:active:not(:disabled) { background: #E6E6E6; }
  button:disabled { color: var(--off); background: #FCFCFC; }
  #start:not(:disabled) { color: var(--ok); font-weight: 600; }
  #stop:not(:disabled) { color: var(--danger); font-weight: 600; }

  .opt { display: flex; align-items: center; gap: var(--gap); font-size: 12px; }
  .opt input { margin: 0; }

  .warn { margin-top: 10px; font-size: 12px; color: var(--warn); }
  .saved { margin-top: 10px; font-size: 12px; color: var(--muted); word-break: break-all; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  th, td { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { margin-top: 10px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <div class="status">
    <span class="dot"></span>
    <span class="state" id="state">…</span>
  </div>
  <div class="addr" id="addr"></div>
  <div class="error" id="error" hidden></div>

  <hr>

  <div class="actions">
    <button id="start">Start Server</button>
    <button id="stop">Stop Server</button>
  </div>

  <hr>

  <label class="opt">
    <input type="checkbox" id="autostart">
    Start on Launch
  </label>

  <hr>

  <div class="actions">
    <button id="refresh">Schedule</button>
    <button id="export">Export CSV</button>
  </div>

  <div id="unlabelled" class="warn" hidden></div>
  <div id="empty" class="empty" hidden>No routes measured yet.</div>
  <table id="rows"></table>
  <div id="saved" class="saved" hidden></div>

<script>
  function call(name, arg) {
    if (window.sketchup && window.sketchup[name]) window.sketchup[name](arg);
  }

  // Ruby pushes state here; the panel never guesses it.
  function render(s) {
    document.body.classList.toggle('running', s.running);
    document.getElementById('state').textContent = s.running ? 'Running' : 'Stopped';
    document.getElementById('addr').textContent = s.host + ':' + s.port;
    document.getElementById('start').disabled = s.running;
    document.getElementById('stop').disabled = !s.running;
    document.getElementById('autostart').checked = s.autostart;

    var err = document.getElementById('error');
    err.hidden = !s.error;
    err.textContent = s.error || '';
    err.title = s.error || '';

    renderSchedule(s.schedule, s.exported);
  }

  function renderSchedule(sc, exported) {
    var tbl = document.getElementById('rows');
    var warn = document.getElementById('unlabelled');
    var empty = document.getElementById('empty');
    var saved = document.getElementById('saved');

    saved.hidden = !exported;
    saved.textContent = exported ? 'Saved: ' + exported : '';

    if (!sc) {
      tbl.innerHTML = '';
      warn.hidden = true;
      empty.hidden = true;
      return;
    }

    empty.hidden = !(sc.rows.length === 0 && sc.unlabelled.routes === 0);
    tbl.innerHTML = sc.rows.length === 0 ? '' :
      '<tr><th>System</th><th class="num">\u00f8</th><th>Storey</th><th class="num">m</th></tr>' +
      sc.rows.map(function (r) {
        return '<tr><td>' + r.system + '</td><td class="num">' + r.diameter_mm +
               '</td><td>' + r.storey + '</td><td class="num">' + r.metres.toFixed(2) + '</td></tr>';
      }).join('') +
      '<tr><td colspan="3"><b>Total</b></td><td class="num"><b>' +
      sc.total_metres.toFixed(2) + '</b></td></tr>';

    // An unlabelled route is metres nobody has priced. It gets its own line in a
    // colour that cannot be read as a total.
    warn.hidden = !(sc.unlabelled && sc.unlabelled.routes > 0);
    if (!warn.hidden) {
      warn.textContent = sc.unlabelled.routes + ' unlabelled route(s), ' +
        sc.unlabelled.metres.toFixed(2) + ' m not priced';
    }
  }

  document.getElementById('start').onclick = function () { call('start'); };
  document.getElementById('stop').onclick = function () { call('stop'); };
  document.getElementById('autostart').onchange = function () {
    call('set_autostart', this.checked);
  };

  document.getElementById('refresh').onclick = function () { call('schedule'); };
  document.getElementById('export').onclick = function () { call('export_schedule', ''); };

  call('ready');
</script>
</body>
</html>
