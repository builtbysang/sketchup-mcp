# Checks that need nothing outside this repo. Agents merge a pull request on their own only when
# every check here passed (the ship-gate hook in prism-harness, Chief 2026-11-01), so a check added
# here must pass on a clean checkout.
name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan of the tree
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 dir /repo --redact --no-banner
      - uses: astral-sh/setup-uv@v5
      - name: Extension against the fake SketchUp API
        run: ruby tests/test_extension.rb
      - name: Server transport
        run: python3 tests/test_transport.py
      - name: Whole stack, only SketchUp faked
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e .
          .venv/bin/python tests/test_end_to_end.py
